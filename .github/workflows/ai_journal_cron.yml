name: "\U0001F9E0 AI Lerntagebuch (Daily/Weekly)"

on:
  schedule:
    # Jeden Tag um 20:30 UTC (22:30 CEST) für die Daily-Retrospektive
    - cron: '30 20 * * 1-5'
    # Jeden Freitag um 21:00 UTC (23:00 CEST) für die Weekly-Retrospektive
    - cron: '0 21 * * 5'
  workflow_dispatch:
    inputs:
      mode:
        description: "Welche Retrospektive?"
        required: true
        default: daily
        type: choice
        options: [daily, weekly]

permissions:
  contents: write

# Ohne diese Klammer koennen sich zwei Laeufe ueberholen und beide eine
# Retrospektive schreiben - am 11.09. ist das passiert (22:41 und 22:50).
#
# Die Gruppe MUSS den Modus enthalten. Mit einer gemeinsamen Gruppe hat der
# Tageslauf den Wochenlauf verdraengt: am 18.09. stand der 20:30-Lauf bis 22:43
# in der Warteschlange, der Wochenlauf war fuer 21:00 faellig und fiel aus.
# Seit dem 12.09. gab es deshalb keine Wochenretrospektive mehr.
concurrency:
  group: ai-journal-${{ github.event.schedule || inputs.mode || 'manual' }}
  cancel-in-progress: false

jobs:
  generate-journal:
    runs-on: ubuntu-latest
    steps:
      - name: "\U0001F4E5 Code auschecken"
        uses: actions/checkout@v4

      - name: "\U0001F40D Python 3.12 einrichten"
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: "\U0001F4E6 Abhängigkeiten installieren"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "\U0001F4DD Tägliche Retrospektive generieren (Mo-Fr)"
        if: github.event.schedule == '30 20 * * 1-5' || inputs.mode == 'daily'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python run_ai_journal.py

      - name: "\U0001F4C5 Wöchentliche Retrospektive generieren (Fr)"
        if: github.event.schedule == '0 21 * * 5' || inputs.mode == 'weekly'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python run_ai_journal.py --weekly

      - name: "\U0001F4BE Datenbank und Strategie-Updates zurückpushen"
        run: |
          git config --global user.name 'Finance AI Bot'
          git config --global user.email 'bot@antigravity.ai'

          # data/portfolio.db ist eine SQLite-Datei und damit binaer - Git kann
          # sie nicht zusammenfuehren. Der Handels-Bot pusht werktags alle fuenf
          # Minuten, also liegt auf origin meist schon eine neuere Datenbank,
          # wenn die naechtliche Retrospektive fertig ist. Der frueher hier
          # stehende `git pull --rebase` konnte deshalb prinzipiell nicht
          # gelingen:
          #
          #   Cannot merge binary files: data/portfolio.db
          #   CONFLICT (content): Merge conflict in data/portfolio.db
          #
          # Am 02.10.2026 ist so eine fertig berechnete Wochenretrospektive fuer
          # beide Depots verlorengegangen. Statt zu rebasen wird jetzt hart auf
          # origin/main zurueckgesetzt und der Eintrag neu geschrieben - er liegt
          # dafuer unversioniert in data/journal_pending/ und ueberlebt den Reset.
          # Die Speicherung ist ein Upsert, erneutes Anwenden also gefahrlos.
          push_ok=0
          for i in 1 2 3; do
            if [ "$i" -gt 1 ]; then
              echo "Versuch $i: auf origin/main zuruecksetzen und Eintrag neu schreiben."
              git fetch origin main
              git reset --hard origin/main
              python tools/reapply_journal.py
            fi

            git add data/portfolio.db data/strategy.json data/incidents.json
            git add data/llm_raw_*.txt 2>/dev/null || true

            if git diff --staged --quiet; then
              echo 'Keine neuen Eintraege.'
              push_ok=1
              break
            fi

            git commit -m '🧠 KI-Lerntagebuch: Retrospektive + Strategie-Optimierung [skip ci]'
            if git push; then
              echo "Push erfolgreich (Versuch $i)."
              push_ok=1
              break
            fi
            echo "Push abgelehnt - der Bot war schneller."
          done

          if [ "$push_ok" -ne 1 ]; then
            echo "::error::Push nach 3 Versuchen fehlgeschlagen. Die Retrospektive"
            echo "::error::liegt noch in data/journal_pending/ auf diesem Runner."
            exit 1
          fi

          python tools/reapply_journal.py --clear >/dev/null 2>&1 || true

