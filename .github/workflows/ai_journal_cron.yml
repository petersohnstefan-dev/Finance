name: "\U0001F9E0 AI Lerntagebuch (Daily/Weekly)"

on:
  schedule:
    # Jeden Tag um 20:30 UTC (22:30 CEST) für die Daily-Retrospektive
    - cron: '30 20 * * 1-5'
    # Jeden Freitag um 21:00 UTC (23:00 CEST) für die Weekly-Retrospektive
    - cron: '0 21 * * 5'
  workflow_dispatch:
    inputs:
      mode:
        description: "Welche Retrospektive?"
        required: true
        default: daily
        type: choice
        options: [daily, weekly]

permissions:
  contents: write

# Ohne diese Klammer koennen sich zwei Laeufe ueberholen und beide eine
# Retrospektive schreiben - am 11.09. ist das passiert (22:41 und 22:50).
concurrency:
  group: ai-journal
  cancel-in-progress: false

jobs:
  generate-journal:
    runs-on: ubuntu-latest
    steps:
      - name: "\U0001F4E5 Code auschecken"
        uses: actions/checkout@v4

      - name: "\U0001F40D Python 3.12 einrichten"
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: "\U0001F4E6 Abhängigkeiten installieren"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "\U0001F4DD Tägliche Retrospektive generieren (Mo-Fr)"
        if: github.event.schedule == '30 20 * * 1-5' || inputs.mode == 'daily'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python run_ai_journal.py

      - name: "\U0001F4C5 Wöchentliche Retrospektive generieren (Fr)"
        if: github.event.schedule == '0 21 * * 5' || inputs.mode == 'weekly'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python run_ai_journal.py --weekly

      - name: "\U0001F4BE Datenbank und Strategie-Updates zurückpushen"
        run: |
          git config --global user.name 'Finance AI Bot'
          git config --global user.email 'bot@antigravity.ai'
          git add data/portfolio.db data/strategy.json
          if git diff --staged --quiet; then
            echo 'Keine neuen Einträge.'
            exit 0
          fi
          git commit -m '🧠 KI-Lerntagebuch: Retrospektive + Strategie-Optimierung [skip ci]'
          # Der Scanner-Bot pusht alle 5 Minuten und trifft diese Minute regelmäßig.
          # Ohne Retry gingen die optimierten Parameter still verloren.
          for i in 1 2 3; do
            if git push; then
              echo "Push erfolgreich (Versuch $i)."
              exit 0
            fi
            echo "Push abgelehnt - Bot war schneller. Rebase und Versuch $i von 3..."
            if ! git pull --rebase; then
              git rebase --abort || true
              echo "::error::Rebase fehlgeschlagen (vermutlich Konflikt in data/portfolio.db)."
              exit 1
            fi
          done
          echo "::error::Push nach 3 Versuchen fehlgeschlagen."
          exit 1
