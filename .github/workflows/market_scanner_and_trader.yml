name: 24/7 AI Market Scanner & Portfolio Trader

on:
  schedule:
    # Scannt alle 5 Minuten während der Kern-Marktphasen (07:00 - 22:00 CEST -> 05:00 - 20:00 UTC) Mo-Fr
    - cron: '*/5 5-20 * * 1-5'
  workflow_dispatch: # Ermöglicht manuelles Starten per Klick in GitHub

permissions:
  contents: write

jobs:
  scan-and-trade:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Code auschecken
        uses: actions/checkout@v4

      - name: 🐍 Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 1. Markt & Foren vollständig scannen
        run: |
          python -m src.realtime_scanner
          python -m src.market_scanner

      - name: 💼 2. Musterdepots aktualisieren & Handels-Check ausführen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "
          import json
          from src.portfolio import PortfolioManager
          pm = PortfolioManager(initial_capital_per_depot=10000.0)
          pm.update_live_prices()
          scan_data = json.load(open('data/market_scan_results.json', encoding='utf-8'))['data']
          actions = pm.auto_trade_check(scan_data)
          print('Ausgeführte Aktionen:', actions)
          "

      - name: 💾 3. Aktualisierte Daten & Depots zurück nach GitHub pushen
        run: |
          git config --global user.name 'Finance AI Bot'
          git config --global user.email 'bot@antigravity.ai'
          git add data/
          if git diff --staged --quiet; then
            echo 'Keine Änderungen zum Committen.'
          else
            git commit -m '🤖 Automatischer 24/7 Markt-Scan & Depot-Update [skip ci]'
            git push
          fi
